# Base configuration for mammo2detr/src. Every key is validated against src/config.py.
# Override anything from the CLI: --set optim.lr=2e-4 --set data.img_size=[1024,768]
seed: 42
device: auto            # auto | cuda | mps | cpu
deterministic: false
resume: null            # path to last.pt to continue a run
init_weights: null      # path to a checkpoint whose model weights initialise this run

data:
  root: ""                      # folder containing metadata.csv and the images
  metadata_csv: metadata.csv
  image_col: null               # auto-detect: link | image_path | path | filename
  image_id_col: image_id
  patient_col: patient_id
  split_col: split
  train_split: train
  val_split: val
  test_split: test
  val_fraction: 0.1             # used only when the CSV has no 'val' split (patient-level carve-out from train)
  image_labels:                 # one or more image-level targets (multi-task)
    - {name: cancer, num_classes: 2, loss: ce, weight: 1.0, class_weights: balanced, label_smoothing: 0.0}
  bbox_cols: [x, y, width, height]
  bbox_format: xywh             # xywh (COCO, pixels) | xyxy
  lesion_label_col: null        # column with lesion category (mass / calcification ...); null = single class
  det_class_names: [lesion]
  img_size: [448, 448]          # network input (H, W)
  resize_mode: stretch          # stretch | letterbox (keeps aspect ratio, pads bottom/right with a mask)
  mean: [0.485, 0.456, 0.406]   # ImageNet statistics (pretrained backbones)
  std: [0.229, 0.224, 0.225]
  min_box_area: 4.0
  max_boxes: null
  aug:
    hflip: 0.5
    vflip: 0.5
    rotate90: 0.0
    affine_p: 0.5
    affine_scale: [0.9, 1.1]
    affine_translate: 0.05
    affine_rotate: 10.0
    affine_shear: 5.0
    bbox_safe_crop_p: 0.3
    bbox_safe_crop_scale: 0.8
    brightness_contrast_p: 0.5
    brightness_limit: 0.2
    contrast_limit: 0.2
    gamma_p: 0.3
    clahe_p: 0.3
    blur_sharpen_p: 0.2
    noise_p: 0.15
    min_visibility: 0.3
  batch_size: 8
  num_workers: 4
  pin_memory: true
  balanced_sampler: true
  balanced_sampler_target: null  # defaults to the first image label
  drop_last: true

model:
  backbone:
    name: resnet50              # alias (see src/models/backbones.py) or timm:<model_name>
    pretrained: true
    out_strides: [8, 16, 32]    # feature levels; exactly one level (e.g. [16]) for transformer.type=standard
    freeze_at: 0                # freeze stem + first N stages
    freeze_bn: false
    unfreeze_last_blocks: null  # ViT only: train just the last N blocks
    drop_path_rate: 0.0
    timm_kwargs: {}
  transformer:
    type: deformable            # deformable (multi-scale, recommended) | standard (single level, conditional attention)
    d_model: 256
    nhead: 8
    num_encoder_layers: 3
    num_decoder_layers: 6
    dim_feedforward: 1024
    dropout: 0.1
    activation: relu
    num_queries: 20
    enc_n_points: 4
    dec_n_points: 4
    box_refine: true
    aux_loss: true
    learn_anchors: true
    pos_temperature: 20.0       # sine temperature for positional encodings (DAB-DETR / DINO default)
  denoising:
    enabled: true
    num_groups: 5
    box_noise_scale: 0.4
    label_noise_ratio: 0.2
    contrastive: true
  heads:
    image_cls: hybrid           # query | pool | hybrid | none
    cls_hidden_dim: 256
    cls_dropout: 0.1

loss:
  det_class_weight: 2.0
  bbox_weight: 5.0
  giou_weight: 2.0
  matcher_cost_class: 2.0
  matcher_cost_bbox: 5.0
  matcher_cost_giou: 2.0
  focal_alpha: 0.25
  focal_gamma: 2.0
  image_loss_weight: 1.0
  aux_weight: 1.0
  dn_weight: 1.0

optim:
  name: adamw
  lr: 1.0e-4
  backbone_lr_mult: 0.1
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  grad_clip: 0.1
  epochs: 50
  scheduler: cosine             # cosine | step | multistep | plateau | none
  warmup_epochs: 1.0
  min_lr_ratio: 0.01
  step_milestones: [40]
  step_gamma: 0.1
  plateau_patience: 10
  amp: true
  accumulate_steps: 1
  ema: {enabled: true, decay: 0.9998, warmup_steps: 500}
  early_stopping_patience: null

eval:
  score_threshold: 0.05
  topk: 10
  nms_iou: null
  ap_iou_thresholds: [0.25, 0.5]
  froc_fppi: [0.125, 0.25, 0.5, 1.0, 2.0, 4.0]
  froc_match: iou               # iou | center
  froc_iou: 0.25
  monitor: det/froc_mean        # any metric key of the val split, e.g. cls/cancer/auc
  monitor_mode: max
  eval_every: 1
  eval_on_test_at_end: true
  viz_samples: 8

logging:
  output_dir: runs
  run_name: null                # auto: <backbone>_<HxW>_<type>_<timestamp>
  log_every: 20
  save_top_k: 2
  save_last: true
  tensorboard: false
  wandb: false
  wandb_project: mammo2detr
